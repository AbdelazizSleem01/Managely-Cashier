<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل البرنامج - Managely Cashier</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link href="../styles/output.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #06b6d4;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            margin: 0;
            color: #f8fafc;
            overflow: hidden;
        }
        
        .license-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(79, 70, 229, 0.2);
            padding: 36px 32px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(79, 70, 229, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            font-size: 2rem;
            color: white;
            animation: pulseGlow 3s infinite alternate;
        }
        
        h2 {
            color: #ffffff;
            font-weight: 800;
            margin: 0 0 8px;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.92rem;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        
        .input-box {
            position: relative;
            margin-bottom: 24px;
        }
        
        .license-input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-size: 1.05rem;
            font-family: monospace, 'Tajawal', sans-serif;
            letter-spacing: 2px;
            text-align: center;
            transition: all 0.25s ease;
            outline: none;
            direction: ltr;
        }
        
        .license-input::placeholder {
            color: #64748b;
            letter-spacing: 1px;
            font-family: 'Tajawal', sans-serif;
        }
        
        .license-input:focus {
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }
        
        .btn-group-action {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .btn-action {
            flex: 1;
            padding: 13px 20px;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        
        .btn-primary-action {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
        }
        
        .btn-primary-action:hover:not(:disabled) {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.45);
        }
        
        .btn-primary-action:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cancel-action {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-cancel-action:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes pulseGlow {
            from {
                box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
            }
            to {
                box-shadow: 0 0 30px rgba(6, 182, 212, 0.6);
            }
        }
    </style>
</head>

<body>
    <div class="license-card">
        <div class="brand-badge">
            <i class="fas fa-shield-alt"></i> Managely Security
        </div>

        <div class="icon-wrapper">
            <i class="fas fa-key"></i>
        </div>

        <h2>تفعيل ترخيص النظام</h2>
        <p class="subtitle">الرجاء إدخال مفتاح الترخيص المخصص لمنشأتك لبدء استخدام برنامج الكاشير</p>
        
        <div class="input-box">
            <input 
                type="text" 
                id="licenseKey" 
                class="license-input" 
                placeholder="XXXXX-XXXXX-XXXXX" 
                autocomplete="off"
                spellcheck="false"
                autofocus
            >
        </div>
        
        <div class="btn-group-action">
            <button id="btnSubmit" class="btn-action btn-primary-action" onclick="submitLicense()">
                <i class="fas fa-check-circle"></i>
                <span id="btnText">تأكيد التفعيل</span>
            </button>
            <button id="btnCancel" class="btn-action btn-cancel-action" onclick="cancelLicense()">
                <i class="fas fa-times"></i> إلغاء
            </button>
        </div>

        <div class="footer-note">
            <i class="fas fa-lock"></i> اتصال آمن ومشفّر بخادم التراخيص
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const keyInput = document.getElementById('licenseKey');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnCancel = document.getElementById('btnCancel');
        const btnText = document.getElementById('btnText');

        // Allow Enter key to trigger submission
        keyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                submitLicense();
            }
        });

        function setLoading(loading) {
            if (loading) {
                btnSubmit.disabled = true;
                btnCancel.disabled = true;
                keyInput.disabled = true;
                btnText.innerText = 'جاري التحقق من الترخيص...';
                btnSubmit.querySelector('i').className = 'fas fa-spinner fa-spin';
            } else {
                btnSubmit.disabled = false;
                btnCancel.disabled = false;
                keyInput.disabled = false;
                btnText.innerText = 'تأكيد التفعيل';
                btnSubmit.querySelector('i').className = 'fas fa-check-circle';
            }
        }

        async function submitLicense() {
            const licenseKey = keyInput.value.trim();
            if (!licenseKey) {
                Swal.fire({
                    icon: 'warning',
                    title: 'تنبيه',
                    text: 'الرجاء إدخال مفتاح الترخيص أولاً',
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#4f46e5'
                });
                keyInput.focus();
                return;
            }

            setLoading(true);

            try {
                // Call modern async IPC handler
                const result = await ipcRenderer.invoke('verify-license-key', licenseKey);

                if (result && result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'تم التفعيل بنجاح! 🎉',
                        text: 'تم التحقق من الترخيص وتوثيق المنشأة، جاري فتح النظام...',
                        timer: 1500,
                        showConfirmButton: false
                    });
                    setTimeout(() => {
                        window.close();
                    }, 1200);
                } else {
                    setLoading(false);
                    Swal.fire({
                        icon: 'error',
                        title: 'تعذر التفعيل',
                        text: result?.message || 'مفتاح الترخيص غير صالح أو غير موجود',
                        confirmButtonText: 'محاولة أخرى',
                        confirmButtonColor: '#4f46e5'
                    });
                    keyInput.focus();
                }
            } catch (err) {
                setLoading(false);
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ في الاتصال',
                    text: err.message || 'فشل الاتصال بخادم التفعيل، يرجى المحاولة لاحقاً',
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#4f46e5'
                });
            }
        }

        function cancelLicense() {
            Swal.fire({
                title: 'هل تريد الخروج؟',
                text: 'لن تتمكن من استخدام البرنامج بدون إتمام التفعيل',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'نعم، إغلاق البرنامج',
                cancelButtonText: 'تراجع'
            }).then((result) => {
                if (result.isConfirmed) {
                    ipcRenderer.send('license-submitted', '');
                    window.close();
                }
            });
        }
    </script>
</body>

</html>

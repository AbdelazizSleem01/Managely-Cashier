<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="returns">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المرتجعات</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link href="../styles/output.css" rel="stylesheet">
    <link href="../styles/home.css" rel="stylesheet">
    <link href="../styles/returns.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body data-page="returns">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <main class="main-content pt-10">
        <div class="p-6 max-w-7xl mx-auto">
            <!-- Page Header -->
            <div class="page-header">
                <div class="header-top">
                    <div class="page-title-group">
                        <div class="page-icon-badge">
                            <i class="fas fa-arrows-rotate"></i>
                        </div>
                        <div>
                            <h1>إدارة المرتجعات</h1>
                            <p>البحث برقم الفاتورة، استرجاع الأصناف، واحتساب مبالغ المرتجع بدقة</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Returns Main Card -->
            <div class="returns-card">
                <!-- Invoice Search Box -->
                <div class="invoice-search-container">
                    <label class="block text-sm font-bold text-gray-700 mb-2" for="invoiceSearch">
                        <i class="fas fa-file-invoice" style="color: var(--primary-color);"></i>
                        <span>البحث عن الفاتورة</span>
                    </label>
                    <div class="search-input-wrap">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="invoiceSearch"
                            placeholder="ابحث برقم الفاتورة، التاريخ، أو اسم العميل...">
                    </div>
                    <div id="invoiceList" class="hidden"></div>
                </div>

                <!-- Invoice Details & Product Selection -->
                <div id="invoiceDetails" class="invoice-details-card hidden">
                    <div class="invoice-details-header">
                        <div class="invoice-details-title">
                            <i class="fas fa-receipt" style="color: var(--primary-color);"></i>
                            <span>تفاصيل الفاتورة المحددة</span>
                        </div>
                        <div class="flex gap-2">
                            <button id="selectAllBtn" class="btn-quick-select btn-select-all"
                                onclick="selectAllProducts()">
                                <i class="fas fa-check-double"></i>
                                <span>تحديد الكل</span>
                            </button>
                            <button id="deselectAllBtn" class="btn-quick-select btn-deselect-all"
                                onclick="deselectAllProducts()">
                                <i class="fas fa-times"></i>
                                <span>إلغاء التحديد</span>
                            </button>
                        </div>
                    </div>

                    <div id="invoiceInfo" class="invoice-info-grid"></div>

                    <h4 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">
                        <i class="fas fa-boxes-stacked" style="color: var(--primary-color);"></i>
                        <span>اختر المنتجات وحدد الكميات المراد استرجاعها:</span>
                    </h4>

                    <div id="productsContainer" class="products-container"></div>
                </div>

                <!-- Return Summary Breakdown -->
                <div id="returnSummary" class="return-summary hidden">
                    <div class="summary-title">
                        <i class="fas fa-calculator"></i>
                        <span>ملخص مبالغ المرتجع</span>
                    </div>
                    <div id="summaryContent"></div>
                </div>

                <!-- Action Button -->
                <button id="submitReturn" class="btn-submit-return" onclick="processReturn()" disabled>
                    <i class="fas fa-undo-alt"></i>
                    <span>تأكيد ومعالجة المرتجع</span>
                </button>
            </div>

            <!-- Back to Home -->
            <div class="back-link-wrap">
                <a href="index.html" class="btn-back-home">
                    <i class="fas fa-arrow-right"></i>
                    <span>العودة للرئيسية</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container" class="z-10"></div>

    <!-- Scripts -->
    <script type="module" src="../js/calculator.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/returns.js"></script>
</body>

</html>

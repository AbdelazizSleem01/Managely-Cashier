<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إعدادات الطابعة</title>
    
    <!-- الروابط الخارجية -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- ملفات CSS المحلية -->
    <link rel="stylesheet" href="../styles/output.css" />
    <link rel="stylesheet" href="../styles/home.css" />
    
    <!-- مكتبات JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --error-color: #dc3545;
            --disabled-color: #aaaaaa;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: "Cairo", Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-content{
            width: 600px;
        }
        
        .container {
            width: 100%;
            max-width: 650px;
            margin: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 12px var(--shadow-color);
            padding: 2rem;
            transition: all 0.3s ease;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333333;
            font-weight: 600;
        }
        
        .printer-list {
            margin-bottom: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
            padding: 0.5rem;
        }
        
        .printer-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 5px;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        
        .printer-item:hover {
            background-color: #f0f0f0;
        }
        
        .printer-item input {
            margin-left: 0.75rem;
            cursor: pointer;
        }
        
        .printer-item label {
            flex: 1;
            cursor: pointer;
        }
        
        .actions {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        button {
            background-color: blueviolet;
            color: #ffffff;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px var(--shadow-color);
        }
        
        button:hover {
            background-color: #0069d9;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        #message {
            margin-top: 1.5rem;
            text-align: center;
            font-weight: 500;
            min-height: 24px;
        }
        
        .success {
            color: var(--success-color);
        }
        
        .error {
            color: var(--error-color);
        }
        #footer-container{
            margin-right: -40px;
        }
        
        /* تأثيرات التحميل */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body data-page="printer-settings">
    <div id="sidebar-container"></div>
    <div class="main-content ">

        <div class="container w-full">
            <h2 class="text-4xl font-bold text-center mb-8 page-title">إعدادات الطابعة</h2>
            
            <div id="printer-list" class="printer-list">
                <div class="flex justify-center items-center py-4">
                    <span>جاري تحميل الطابعات...</span>
                    <div class="loading"></div>
                </div>
            </div>
            
            <div class="actions p-4">
                <button id="save-btn" class="p-4 btn btn-priamry bg-primary text-white hover:bg-primary/80"  disabled>
                    <i class="fas fa-save mr-2"></i>
                    حفظ كطابعة افتراضية
                </button>
            </div>
            
            <div id="message" class="my-3"></div>
            <a href="index.html"
                            class="btn flex items-center justify-center mx-auto  btn-primary px-8 hover:bg-primary hover:text-white transition duration-300">
                            العودة للرئيسية
                            <i class="fas fa-home "></i>
                        </a>
            <div id="footer-container" class="z-10  flex justify-center"></div>

            
    </div>

    <!-- ملفات JavaScript -->
    <script type="module" src="../js/calculator.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/printer-settings.js"></script>
</body>
</html>

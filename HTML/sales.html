<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="sales">

<head>
    <meta charset="UTF-8">
    <title>المبيعات</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/output.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/sales.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-gray-50 min-h-screen" data-page="sales">
    <div id="sidebar-container"></div>

    <div class="main-content pt-18 mb-10">
        <div class="container mx-auto px-4 py-6 ">
            <!-- Unified Page Header -->
            <div class="page-header">
                <div class="header-top">
                    <div class="page-title-group">
                        <div class="page-icon-badge">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div>
                            <h1>سجل المبيعات</h1>
                            <p>متابعة وتفاصيل الفواتير والعمليات البيعية وتصدير التقارير</p>
                        </div>
                    </div>

                    <div class="header-stats">
                        <div class="stat-pill stat-pill-sales">
                            <i class="fas fa-coins"></i>
                            <div class="stat-info">
                                <span class="stat-label">إجمالي المبيعات</span>
                                <span class="stat-value" id="totalSalesAmount">0.00 ج.م</span>
                            </div>
                        </div>
                        <div class="stat-pill stat-pill-profit" style="background: #ecfdf5; border-color: #a7f3d0;">
                            <i class="fas fa-hand-holding-dollar" style="color: #059669;"></i>
                            <div class="stat-info">
                                <span class="stat-label">صافي الأرباح</span>
                                <span class="stat-value" id="totalProfitAmount" style="color: #059669;">0.00 ج.م</span>
                            </div>
                        </div>
                        <div class="stat-pill stat-pill-count">
                            <i class="fas fa-receipt"></i>
                            <div class="stat-info">
                                <span class="stat-label">عدد الفواتير</span>
                                <span class="stat-value" id="totalInvoicesCount">0</span>
                            </div>
                        </div>
                        <div class="stat-pill stat-pill-returns">
                            <i class="fas fa-arrows-rotate"></i>
                            <div class="stat-info">
                                <span class="stat-label">المرتجعات</span>
                                <span class="stat-value" id="totalReturnsCount">0</span>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Single Line Controls Bar -->
                <div class="header-controls">
                    <div class="header-search-wrap">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchInput" placeholder="ابحث عن رقم فاتورة، اسم عميل، هاتف، أو منتج..."
                            oninput="handleSearch()" autocomplete="off" />
                    </div>
                    <select id="salesCurrencyFilter" class="filter-select" onchange="handleSearch()" title="تصفية حسب العملة" style="padding: 9px 14px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: #fff; font-weight: 700; color: #1e1b4b; font-size: 0.88rem; outline: none; cursor: pointer;">
                        <option value="">جميع العملات</option>
                    </select>
                    <button onclick="exportToExcel()" class="btn-export-excel" id="exportExcelBtn">
                        <i class="fas fa-file-excel"></i>
                        <span>تصدير إلى Excel</span>
                    </button>
                </div>
            </div>

            <!-- Sales Table Card Container -->
            <div class="sales-card-container">
                <div class="sales-table-wrap">
                    <table class="sales-table">
                        <thead>
                            <tr>
                                <th>رقم الفاتورة</th>
                                <th>التاريخ</th>
                                <th>المنتجات</th>
                                <th>الإجمالي</th>
                                <th>اسم العميل</th>
                                <th>رقم الهاتف</th>
                                <th style="text-align: center;">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="salesTable">
                            <!-- Immediate synchronous rendering from cache before paint -->
                            <script>
                                (function () {
                                    try {
                                        const cachedSettings = localStorage.getItem("managely_store_settings");
                                        if (cachedSettings) {
                                            const s = JSON.parse(cachedSettings);
                                            const appName = document.getElementById("appName");
                                            const footerLogo = document.getElementById("footerLogo");
                                            if (appName && s.storeName) appName.textContent = s.storeName;
                                            if (footerLogo && s.logo) { footerLogo.src = s.logo; footerLogo.classList.remove("hidden"); }
                                        }
                                        const dt = document.getElementById("currentDateTime");
                                        if (dt) {
                                            dt.textContent = (new Date()).toLocaleString("ar-EG", { weekday: "long", year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
                                        }

                                        const cached = localStorage.getItem("managely_sales_cache");
                                        if (cached) {
                                            const sales = JSON.parse(cached);
                                            if (Array.isArray(sales) && sales.length > 0) {
                                                const totalAmt = sales.reduce((sum, s) => sum + (Number(s.total) || 0), 0);
                                                const totalRet = sales.filter(s => s.hasReturn).length;
                                                const formatCompact = (val) => {
                                                    const n = Number(val) || 0;
                                                    const a = Math.abs(n);
                                                    if (a >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B ج.م';
                                                    if (a >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M ج.م';
                                                    if (a >= 1e4) return (n / 1e3).toFixed(1).replace(/\.?0+$/, '') + 'K ج.م';
                                                    return n.toFixed(2) + ' ج.م';
                                                };
                                                const elAmt = document.getElementById("totalSalesAmount");
                                                const elCnt = document.getElementById("totalInvoicesCount");
                                                const elRet = document.getElementById("totalReturnsCount");
                                                if (elAmt) {
                                                    elAmt.textContent = formatCompact(totalAmt);
                                                    elAmt.title = `القيمة الدقيقة: ${totalAmt.toLocaleString("ar-EG", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ج.م`;
                                                }
                                                if (elCnt) elCnt.textContent = sales.length >= 10000 ? (sales.length / 1000).toFixed(1) + 'K' : sales.length.toLocaleString("ar-EG");
                                                if (elRet) elRet.textContent = totalRet.toLocaleString("ar-EG");

                                                const tbody = document.getElementById("salesTable");
                                                if (tbody) {
                                                    tbody.innerHTML = sales.slice(0, 10).map(s => {
                                                        const items = Array.isArray(s.items) ? s.items : [];
                                                        const formattedDate = new Date(s.date).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });
                                                        const itemsHtml = items.map(item => `
                                                            <div class="product-item-chip">
                                                                <span class="prod-name" title="${item.name || 'منتج غير محدد'}">${item.name || "منتج غير محدد"}</span>
                                                                <span class="prod-qty-price">${item.quantity || 0} × ${(item.price || 0).toFixed(2)} ج</span>
                                                            </div>
                                                        `).join("");

                                                        return `
                                                            <tr>
                                                                <td>
                                                                    <div style="font-weight: 800; color: var(--primary-color);">
                                                                        #${s.invoiceNumber || "--"}
                                                                        ${s.hasReturn ? '<span class="badge-returned"><i class="fas fa-rotate-left"></i> مرتجع</span>' : ''}
                                                                    </div>
                                                                </td>
                                                                <td style="color: #64748b; font-size: 0.85rem;">${formattedDate}</td>
                                                                <td>
                                                                    <div class="row-product-list">
                                                                        ${itemsHtml || '<span style="color:#94a3b8; font-size:0.8rem;">لا توجد عناصر</span>'}
                                                                    </div>
                                                                </td>
                                                                <td><span class="total-amount-tag">${(Number(s.total) || 0).toFixed(2)} ج.م</span></td>
                                                                <td style="font-weight: 600;">${s.customerName || "--"}</td>
                                                                <td style="direction: ltr; text-align: right; color: #64748b; font-size: 0.85rem;">${s.customerPhone || "--"}</td>
                                                                <td>
                                                                    <div class="table-action-btns">
                                                                        <button onclick="printSale('${s._id}')" class="btn-tbl-action btn-tbl-print" title="طباعة الفاتورة">
                                                                            <i class="fas fa-print"></i>
                                                                        </button>
                                                                        <button onclick="deleteSale('${s._id}')" class="btn-tbl-action btn-tbl-delete" title="حذف الفاتورة">
                                                                            <i class="fas fa-trash-can"></i>
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        `;
                                                    }).join("");
                                                }
                                            }
                                        }
                                    } catch (e) { }
                                })();
                            </script>
                        </tbody>
                    </table>
                </div>
                <!-- Sales Pagination -->
                <div id="salesPagination" style="padding: 16px;"></div>
            </div>

            <!-- زر العودة للرئيسية -->
            <div class="back-link-wrap">
                <a href="index.html" class="btn-back-home">
                    <i class="fas fa-arrow-right"></i>
                    <span>العودة للرئيسية</span>
                </a>
            </div>
        </div>
    </div>

    <div id="footer-container" class="z-10">
        <footer id="globalFooter" class="fixed bottom-0 w-full bg-gray-500 text-white text-center py-4">
            <div id="footerContent" class="flex justify-between items-center px-6">
                <div class="flex items-center gap-4">
                    <img id="footerLogo" class="h-10 w-10 rounded-full hidden" alt="Logo" />
                    <span id="appName" class="font-bold text-lg text-primary"></span>
                </div>
                <div class="flex items-end gap-4">
                    <i class="fas fa-calendar-alt text-primary"></i>
                    <span id="currentDateTime" class="text-sm block"></span>
                    <i class="fas fa-clock text-primary"></i>
                </div>
            </div>
        </footer>
    </div>

    <!-- Floating Calculator Button -->
    <button id="floatingCalcButton" class="btn btn-circle btn-primary shadow-lg calc-button"
        onclick="openCalculatorPopup()">
        <div class="tooltip" data-tip="آلة حاسبة">
            <i class="fas fa-calculator text-xl"></i>
        </div>
    </button>

    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script type="module" src="../js/calculator.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/sales.js"></script>
    <script type="module">
        import { handleSearch, exportToExcel, deleteSale, printSale } from '../js/sales.js';
        window.handleSearch = handleSearch;
        window.exportToExcel = exportToExcel;
        window.deleteSale = deleteSale;
        window.printSale = printSale;
    </script>
</body>

</html>

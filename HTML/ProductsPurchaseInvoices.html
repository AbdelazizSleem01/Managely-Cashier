<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام فواتير الشراء</title><link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet"><link href="../styles/output.css" rel="stylesheet"><link href="../styles/home.css" rel="stylesheet"><link href="../styles/ProductsPurchaseInvoices.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script></head><body class="font-sans" data-page="ProductsPurchaseInvoices"><div id="sidebar-container"></div><div class="main-content min-h-screen"><div class="max-w-7xl mx-auto"><div class="flex justify-between items-center mb-8"><h1 class="text-3xl font-bold text-gray-800 page-title"><i class="fas fa-file-invoice-dollar text-primary"></i>إدارة فواتير الشراء</h1></div><div id="invoiceFormSection" class="invoice-form-section p-6 mb-8 bg-white shadow-lg rounded-lg"><h2 id="formTitle" class="section-title text-2xl mb-6"><i class="fas fa-file-alt text-primary"></i><span>إضافة فاتورة جديدة</span></h2><form id="invoiceForm" class="space-y-6"><input type="hidden" id="editingInvoiceId"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-truck text-primary"></i>اختر المورد <span class="required-star">*</span></span></label><input id="supplierSearch" type="text" list="supplierList" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="ابحث باسم أو رقم المورد..." required><datalist id="supplierList"></datalist><input type="hidden" id="paymentMethod"></div><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-user-tie text-primary"></i>اسم المورد <span class="required-star">*</span></span></label><input id="supplierName" type="text" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="اسم المورد" readonly="readonly" required></div><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-phone text-primary"></i>رقم المورد <span class="required-star">*</span></span></label><input id="supplierPhone" type="text" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="رقم المورد" readonly="readonly" required></div><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-user-tie text-primary"></i>اسم المنشئ <span class="required-star">*</span></span></label><input id="createdByName" type="text" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="اسم منشئ الفاتورة" required></div><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-mobile-alt text-primary"></i>رقم المنشئ <span class="required-star">*</span></span></label><input id="createdByPhone" type="text" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="رقم المنشئ" required></div><div class="mt-8 w-full md:col-span-2 lg:col-span-4"><h3 class="section-title text-xl mb-4 text-center text-gray-800 font-bold"><i class="fas fa-cart-plus text-primary"></i>إضافة منتجات</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-boxes-stacked text-primary"></i>المنتج</span></label><select id="productSelect" class="select w-full bg-transparent select-primary text-gray-800"><option value="">اختر منتجًا</option></select></div><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-border-all text-primary"></i>الكمية</span></label><input id="quantity" type="number" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="الكمية" min="1"></div><div class="form-control w-full"><button type="button" onclick="addItem()" class="btn btn-primary w-full add-button"><i class="fas fa-plus-circle"></i>إضافة</button></div></div><div class="mt-6"><h4 class="text-lg font-semibold mb-3 text-gray-700"><i class="fas fa-list-ul text-primary"></i>المنتجات المضافة</h4><ul id="itemsList" class="items-list space-y-2"></ul></div></div><div class="form-control"><label class="label"><span id="paymentLabel" class="label-text text-gray-800 font-semibold"><i class="fas fa-money-check-alt text-primary"></i>عدد الدفعات</span></label><input id="installmentCount" type="number" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="عدد الدفعات" min="1" value="3" required style="display:none" data-show-on="installment"> <input id="paymentDisplay" type="text" class="input bg-transparent text-gray-800 input-primary w-full" readonly="readonly" value="كاش"></div>
                <div class="form-control" id="installmentDatesContainer" style="display:none">
                    <label class="label">
                        <span class="label-text text-gray-800 font-semibold">
                            <i class="fas fa-calendar-alt text-primary"></i>مواعيد الدفع
                        </span>
                    </label>
                    <div id="installmentDates" class="space-y-2">
                        <!-- سيتم إضافة مواعيد الدفع هنا ديناميكياً -->
                    </div>
                </div>
                <div class="form-control w-full"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-calculator text-primary"></i>المجموع <span class="required-star">*</span></span></label><input id="totalAmount" type="number" class="input bg-transparent text-gray-800 input-primary w-full" placeholder="المجموع" step="0.01" required></div><div class="form-control"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-calendar-day text-primary"></i>تاريخ الفاتورة <span class="required-star">*</span></span></label><input id="invoiceDate" type="date" class="input bg-transparent text-gray-800 input-primary w-full datepicker-dark" required></div></div><div class="form-control mt-2"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-sticky-note text-primary"></i>ملاحظات</span><span class="label-text text-gray-800-alt text-primary">(اختياري)</span></label><textarea id="notes" class="textarea w-full h-24 bg-transparent textarea-primary" placeholder="ملاحظات إضافية..."></textarea></div><div class="mt-6"><label class="label"><span class="label-text text-gray-800 font-semibold"><i class="fas fa-image text-primary"></i>صورة الفاتورة</span><span class="label-text text-gray-800-alt text-primary">(اختياري)</span></label><div class="file-upload rounded-lg p-4 text-center cursor-pointer"><input id="invoiceImage" type="file" class="hidden" accept="image/*"><div class="flex flex-col items-center justify-center"><i class="fas fa-cloud-upload-alt text-3xl text-primary mb-2"></i><p class="text-sm text-gray-600">اسحب وأسقط الصورة هنا أو انقر للاختيار</p><p class="text-xs text-gray-500 mt-1">JPEG, PNG (الحجم الأقصى 5MB)</p></div></div><div id="imagePreview" class="mt-4"><div id="noImageText"><p class="text-gray-600 text-center">لم يتم اختيار صورة</p></div><div id="imageContainer" class="hidden flex justify-center"><button type="button" onclick="clearImage()" class="btn btn-sm btn-error mt-2 m-5" title="حذف الصورة"><i class="fas fa-trash mx-auto"></i></button><img id="imagePreviewImg" alt="معاينة الصورة" class="rounded-lg imagePreviewImg p-2"></div></div></div><div class="flex justify-start gap-4 mt-10"><button type="submit" class="btn btn-success w-32">حفظ<i class="fas fa-save"></i></button><button type="button" onclick="cancelEdit()" class="btn btn-warning w-32">إلغاء<i class="fas fa-times-circle"></i></button></div></form></div><div class="mb-8"><h2 class="section-title text-2xl mb-6"><i class="fas fa-list-ul text-primary"></i>قائمة الفواتير</h2><input type="search" id="invoicesSearch" class="input input-primary w-full rounded-lg border my-3 p-2 bg-white" placeholder="ابحث في الفواتير عن طريق اسم المورد، رقم الهاتف، اسم الموظف، والمبلغ الإجمالي..."><div id="invoicesList" class="mt-4"></div><div id="productsPurchasePagination"></div></div><div class="text-center mt-6"><a href="index.html" class="btn btn-primary text-white"><p class="text-white">العودة للرئيسية</p><i class="fas fa-home ml-2 text-white"></i></a></div></div></div><div id="footer-container" class="z-10"></div><script type="module" src="../js/calculator.js"></script><script type="module" src="../js/shared.js"></script><script type="module" src="../js/ProductsPurchaseInvoices.js"></script><script>document.getElementById('invoiceImage').addEventListener('change', function (e) {
            const file = e.target.files[0];
            const noImageText = document.getElementById('noImageText');
            const imageContainer = document.getElementById('imageContainer');
            const previewImg = document.getElementById('imagePreviewImg');

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    noImageText.style.display = 'none';
                    imageContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                noImageText.style.display = 'block';
                imageContainer.classList.add('hidden');
                previewImg.src = '';
            }
        });

        document.querySelector('.file-upload').addEventListener('click', function () {
            document.getElementById('invoiceImage').click();
        });

        window.clearImage = function () {
            document.getElementById('invoiceImage').value = '';
            document.getElementById('noImageText').style.display = 'block'; 
            document.getElementById('imageContainer').classList.add('hidden'); 
            document.getElementById('imagePreviewImg').src = '';
        };</script></body></html>

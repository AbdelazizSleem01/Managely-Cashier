<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Managely Cashier - شاشة التحميل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #1e293b;
        }

        /* Soft background shapes */
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-shape-1 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(109, 40, 217, 0.08) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            animation: floatGlow 8s ease-in-out infinite alternate;
        }
        .bg-shape-2 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.07) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
        }

        .splash-card {
            position: relative;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.07),
                0 20px 50px -10px rgba(109, 40, 217, 0.12),
                0 0 0 1px rgba(109, 40, 217, 0.04);
            border-radius: 28px;
            padding: 44px 40px 36px;
            width: 440px;
            text-align: center;
            animation: cardEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 10;
        }

        /* Colored top accent line */
        .splash-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, #7c3aed, #a855f7, #6d28d9);
            border-radius: 0 0 4px 4px;
        }

        /* Logo Container */
        .logo-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Solid gradient ring */
        .logo-ring-outer {
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #7c3aed, #a855f7, #c084fc, #7c3aed);
            animation: rotateRing 5s linear infinite;
            padding: 3px;
        }
        .logo-ring-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ffffff;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            position: absolute;
            z-index: 2;
            border-radius: 50%;
            filter: drop-shadow(0 4px 12px rgba(109, 40, 217, 0.2));
            animation: logoBounce 3s ease-in-out infinite;
        }

        /* Title & Tagline */
        .brand-title {
            font-size: 1.85rem;
            font-weight: 900;
            color: #1e293b;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 28px;
        }

        /* Progress Bar */
        .progress-wrapper {
            width: 100%;
            height: 6px;
            background: #f1f5f9;
            border-radius: 100px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6d28d9 0%, #8b5cf6 50%, #a855f7 100%);
            border-radius: 100px;
            box-shadow: 0 0 10px rgba(109, 40, 217, 0.4);
            transition: width 0.4s ease-out;
        }

        .status-text {
            font-size: 0.88rem;
            color: #64748b;
            font-weight: 600;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-text i {
            color: #7c3aed;
            font-size: 0.8rem;
            animation: spin 1.2s linear infinite;
        }

        /* Version Badge */
        .badge-version {
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #7c3aed;
            background: rgba(109, 40, 217, 0.08);
            border: 1px solid rgba(109, 40, 217, 0.2);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .footer-copyright {
            margin-top: 22px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Divider */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 24px 0 20px;
        }

        /* Keyframes */
        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.93) translateY(18px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes floatGlow {
            from { transform: scale(0.9) translate(-20px, -10px); }
            to   { transform: scale(1.1) translate(20px, 10px); }
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @keyframes logoBounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-5px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .fade-out {
            opacity: 0;
            transform: scale(0.96);
            transition: all 0.5s ease-in;
        }
    </style>
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="splash-card" id="splashCard">
        <div class="badge-version" id="versionBadge"></div>

        <div class="logo-wrapper">
            <div class="logo-ring-outer">
                <div class="logo-ring-inner"></div>
            </div>
            <img src="../assets/images/Logo.png" alt="Managely Logo" class="logo-img" onerror="this.src='../assets/images/pay.png'">
        </div>

        <h1 class="brand-title">Managely Cashier</h1>
        <p class="brand-subtitle">نظام إدارة نقاط البيع والكاشير المتقدم</p>

        <div class="progress-wrapper">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="status-text" id="statusText">
            <i class="fas fa-circle-notch"></i>
            <span id="statusLabel">جاري تهيئة النظام...</span>
        </div>

        <div class="divider"></div>

        <div class="footer-copyright">
            حقوق النشر © 2026 Abdelaziz Sleem | جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        const progressBar = document.getElementById('progressBar');
        const statusLabel = document.getElementById('statusLabel');
        const splashCard = document.getElementById('splashCard');
        const versionBadge = document.getElementById('versionBadge');

        // Dynamically load real app version
        async function loadDynamicAppVersion() {
            try {
                if (window.electronAPI?.getAppVersion) {
                    const v = await window.electronAPI.getAppVersion();
                    if (v && versionBadge) {
                        versionBadge.textContent = 'v' + v;
                        localStorage.setItem('managely_app_version', v);
                        return;
                    }
                }
                if (window.electronAPI?.updater?.getVersion) {
                    const v = await window.electronAPI.updater.getVersion();
                    if (v && versionBadge) {
                        versionBadge.textContent = 'v' + v;
                        localStorage.setItem('managely_app_version', v);
                        return;
                    }
                }
            } catch (e) {
                console.warn('Failed to retrieve dynamic app version:', e);
            }

            const cached = localStorage.getItem('managely_app_version');
            if (cached && versionBadge) {
                versionBadge.textContent = 'v' + cached;
            }
        }
        loadDynamicAppVersion();

        const steps = [
            { progress: 20, text: 'جاري تهيئة قاعدة البيانات المحلية...', delay: 400 },
            { progress: 50, text: 'فحص تكامل بيانات الكاشير والمبيعات...', delay: 800 },
            { progress: 85, text: 'جاري تحميل واجهة المستخدم الرئيسية...', delay: 1400 },
            { progress: 100, text: 'مرحباً بك! جاري فتح البرنامج...', delay: 2000 }
        ];

        steps.forEach(step => {
            setTimeout(() => {
                progressBar.style.width = step.progress + '%';
                statusLabel.textContent = step.text;
            }, step.delay);
        });

        function determineUserTargetPage(user) {
            if (!user) return 'index.html';
            const userPages = user?.permissions?.pages || {};
            if (userPages.home) return 'index.html';
            if (userPages.salesInvoice) return 'sales-invoice.html';
            const PAGE_MAP = {
                sales: 'sales.html',
                products: 'products.html',
                categories: 'categories.html',
                customers: 'customers.html',
                suppliers: 'suppliers.html',
                purchaseInvoices: 'purchase-invoices.html',
                productsPurchaseInvoices: 'ProductsPurchaseInvoices.html',
                returns: 'returns.html',
                treasury: 'treasury.html',
                statistics: 'statistics.html',
                employees: 'employees.html',
                printerSettings: 'printer-settings.html',
                settings: 'settings.html',
                users: 'users.html'
            };
            for (const [key, url] of Object.entries(PAGE_MAP)) {
                if (userPages[key]) return url;
            }
            return 'index.html';
        }

        async function checkAutoLoginAndProceed() {
            let targetDestination = 'login.html';
            const justLoggedOut = sessionStorage.getItem('justLoggedOut') === 'true';

            if (!justLoggedOut) {
                try {
                    let validUser = null;
                    const sessionRaw = localStorage.getItem('managely_auth_session');
                    if (sessionRaw) {
                        const session = JSON.parse(sessionRaw);
                        const isExpired = session.expiresAt && Date.now() > session.expiresAt;
                        if (session && session.user && (!session.expiresAt || !isExpired)) {
                            validUser = session.user;
                        }
                    }

                    // Fallback check from persistent backend settingsDB
                    if (!validUser && window.electronAPI && window.electronAPI.getRememberedSession) {
                        const backendSession = await window.electronAPI.getRememberedSession();
                        if (backendSession && backendSession.user) {
                            const isExpired = backendSession.expiresAt && Date.now() > backendSession.expiresAt;
                            if (!backendSession.expiresAt || !isExpired) {
                                validUser = backendSession.user;
                                // Sync back to localStorage
                                localStorage.setItem('managely_auth_session', JSON.stringify(backendSession));
                            }
                        }
                    }

                    if (validUser) {
                        localStorage.setItem('currentUser', JSON.stringify(validUser));
                        localStorage.setItem('isLoggedIn', 'true');
                        targetDestination = determineUserTargetPage(validUser);
                        statusLabel.textContent = `مرحباً بك، ${validUser.name || 'بك'}! جاري فتح البرنامج...`;
                    }
                } catch (err) {
                    console.warn('Auto-login check error in splash:', err);
                }
            }

            setTimeout(() => {
                splashCard.classList.add('fade-out');
                setTimeout(() => {
                    window.location.href = targetDestination;
                }, 350);
            }, 2200);
        }

        checkAutoLoginAndProceed();
    </script>
</body>
</html>

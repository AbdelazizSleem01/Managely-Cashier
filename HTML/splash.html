<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الكاشير</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            color: white;
            animation: fadeInUp 1s ease-out;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }

        .app-name {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .app-description {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .loading-bar {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            margin: 0 auto 2rem;
            overflow: hidden;
            position: relative;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #fff, #f0f0f0);
            border-radius: 3px;
            animation: loading 3s ease-in-out infinite;
            width: 0%;
        }

        .loading-text {
            font-size: 1rem;
            opacity: 0.8;
            animation: blink 1.5s infinite;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 3rem;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .feature i {
            color: #4ade80;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes loading {
            0% {
                width: 0%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        @keyframes blink {
            0%, 50% {
                opacity: 0.8;
            }
            51%, 100% {
                opacity: 0.4;
            }
        }

        .version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        .company {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
            color: rgb(234, 234, 234);
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">
            <i class="fas fa-cash-register"></i>
        </div>
        
        <h1 class="app-name">نظام إدارة الكاشير</h1>
        <p class="app-description">حل متكامل لإدارة المبيعات والمخزون</p>
        
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        
        <p class="loading-text">جاري تحميل النظام...</p>
        
        <div class="features">
            <div class="feature">
                <i class="fas fa-check-circle"></i>
                <span>إدارة المنتجات</span>
            </div>
            <div class="feature">
                <i class="fas fa-check-circle"></i>
                <span>المبيعات والفواتير</span>
            </div>
            <div class="feature">
                <i class="fas fa-check-circle"></i>
                <span>إدارة الخزنة</span>
            </div>
            <div class="feature">
                <i class="fas fa-check-circle"></i>
                <span>التقارير والإحصائيات</span>
            </div>
        </div>
    </div>

    <div class="version">الإصدار 1.0.0</div>
    <div class="company">تم التطوير بواسطة عبدالعزيز سليم </div>

    <script>
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 4000);

     
        const loadingTexts = [
            'جاري تحميل النظام...',
            'جاري تهيئة قاعدة البيانات...',
            'جاري تحميل الواجهات...',
            'جاري التحقق من الترخيص...',
            'جاهز للاستخدام!'
        ];

        let currentTextIndex = 0;
        const loadingTextElement = document.querySelector('.loading-text');

        setInterval(() => {
            loadingTextElement.style.opacity = '0';
            setTimeout(() => {
                loadingTextElement.textContent = loadingTexts[currentTextIndex];
                loadingTextElement.style.opacity = '1';
                currentTextIndex = (currentTextIndex + 1) % loadingTexts.length;
            }, 200);
        }, 800);
    </script>
</body>
</html>

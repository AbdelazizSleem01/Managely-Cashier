<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الموردين</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/output.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 100%);
            min-height: 100vh;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }

        /* ===== Page Header ===== */
        .page-header {
            border-radius: 20px;
            padding: 28px 32px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .page-header h1 {
            color: #6d28d9;
            font-size: 1.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
        }

        .page-header p {
            color: rgba(98, 98, 98, 0.75);
            font-size: 0.9rem;
            margin: 4px 0 0;
        }

        .add-btn-header {
            background: #6d28d9;
            border: 1.5px solid rgba(255,255,255,0.4);
            color: white;
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .add-btn-header:hover {
            background: rgba(255,255,255,0.28);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        /* ===== Supplier Cards ===== */
        #suppliersList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .supplier-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(109, 40, 217, 0.08);
            border: 1.5px solid #ede9fe;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .supplier-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            border-radius: 0 18px 18px 0;
        }

        .supplier-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(109, 40, 217, 0.18);
            border-color: #c4b5fd;
        }

        .supplier-card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .supplier-avatar {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ede9fe, #ddd6fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #7c3aed;
            flex-shrink: 0;
        }

        .supplier-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e1b4b;
        }

        .due-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 999px;
            margin-top: 3px;
        }

        .due-badge.has-due {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .due-badge.no-due {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .supplier-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f3f0ff;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            color: #6b7280;
        }

        .detail-row i {
            width: 18px;
            color: #7c3aed;
            font-size: 0.85rem;
        }

        .supplier-card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-transactions {
            flex: 1;
            background: #f5f3ff;
            color: #7c3aed;
            border: 1.5px solid #e9d5ff;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-transactions:hover {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-edit {
            background: #eff6ff;
            color: #2563eb;
        }

        .btn-edit:hover {
            background: #2563eb;
            color: white;
        }

        .btn-delete {
            background: #fef2f2;
            color: #dc2626;
        }

        .btn-delete:hover {
            background: #dc2626;
            color: white;
        }

        /* ===== Empty State ===== */
        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 64px 32px;
            background: white;
            border-radius: 24px;
            border: 2px dashed #e9d5ff;
            text-align: center;
            gap: 16px;
            margin: 20px;
        }

        .empty-icon-wrap {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ede9fe, #ddd6fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #7c3aed;
        }

        .empty-state h3 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e1b4b;
            margin: 0;
        }

        .empty-state p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin: 0;
        }

        .empty-state .add-first-btn {
            background: linear-gradient(135deg, #6d28d9, #4f46e5);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(109,40,217,0.3);
        }

        .empty-state .add-first-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(109,40,217,0.4);
        }

        /* ===== Modal Overlay ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 10, 40, 0.55);
            backdrop-filter: blur(4px);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 20px;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
            
        }

        .modal-box {
            background: #ffffff !important;
            background-color: #ffffff !important;
            color-scheme: light;
            color: #1e1b4b;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            overflow: hidden; /* clip scrollbar cleanly inside border-radius */
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(109, 40, 217, 0.25);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            padding: 0 !important; /* override DaisyUI padding so scrollbar is flush to edge */
        }

        /* Inner scroll area — scrollbar is flush to edge and clipped by modal-box */
        .modal-scroll-inner {
            overflow-y: auto;
            padding: 28px 28px 24px 28px;
            flex: 1;
            scrollbar-width: thin;
            scrollbar-color: #7c3aed #f5f3ff;
        }

        .modal-scroll-inner::-webkit-scrollbar {
            width: 6px;
        }

        .modal-scroll-inner::-webkit-scrollbar-track {
            background: #f5f3ff;
            border-radius: 0;
        }

        .modal-scroll-inner::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #7c3aed, #4f46e5);
            border-radius: 999px;
        }

        .modal-scroll-inner::-webkit-scrollbar-thumb:hover {
            background: #6d28d9;
        }

        .modal-overlay.open .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1.5px solid #f3f0ff;
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #1e1b4b;
        }

        .modal-title i {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ede9fe, #ddd6fe);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7c3aed;
            font-size: 1rem;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: none;
            background: #fef2f2;
            color: #dc2626;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: #dc2626;
            color: white;
        }

        /* Modal Fields */
        .field-group {
            margin-bottom: 18px;
        }

        .field-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .field-group label i {
            color: #7c3aed;
            font-size: 0.82rem;
        }

        .required-star { color: #dc2626; }

        .modal-input {
            width: 100%;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.9rem;
            color: #374151 !important;
            background: #fafafa !important;
            background-color: #fafafa !important;
            color-scheme: light;
            transition: all 0.2s;
            outline: none;
            appearance: auto;
        }

        .modal-input:focus {
            border-color: #7c3aed;
            background: #fff !important;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        .modal-input[readonly] {
            background: #f3f4f6 !important;
            color: #9ca3af !important;
            cursor: not-allowed;
        }

        .field-group label {
            color: #374151 !important;
        }

        .modal-title {
            color: #1e1b4b !important;
        }

        .modal-header {
            border-bottom-color: #f3f0ff !important;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1.5px solid #f3f0ff;
        }

        .btn-save {
            flex: 1;
            background: linear-gradient(135deg, #6d28d9, #4f46e5) !important;
            background-color: #6d28d9 !important;
            color: #ffffff !important;
            border: none !important;
            padding: 11px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(109,40,217,0.4) !important;
        }

        .btn-cancel {
            background: #f3f4f6;
            color: #6b7280;
            border: none;
            padding: 11px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background: #e5e7eb;
            color: #374151;
        }

        /* Payment method tag */
        .payment-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: #ede9fe;
            color: #6d28d9;
        }
    </style>
</head>

<body data-page="suppliers">
    <div id="sidebar-container"></div>

    <div class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="fas fa-truck"></i> إدارة الموردين</h1>
            </div>
            <button class="add-btn-header" onclick="openAddSupplierModal()">
                <i class="fas fa-plus-circle"></i>
                إضافة مورد جديد
            </button>
        </div>

        <!-- Suppliers Grid -->
        <div id="suppliersList" class="p-3"></div>
    </div>

    <!-- ===== Supplier Modal ===== -->
    <div id="supplierModal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-box">
            <div class="modal-scroll-inner">
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fas fa-user-tie"></i>
                    <span id="formTitle">إضافة مورد جديد</span>
                </div>
                <button class="modal-close" onclick="closeSupplierModal()" title="إغلاق">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="supplierForm">
                <input type="hidden" id="editingSupplierId">

                <div class="field-group">
                    <label><i class="fas fa-signature"></i> اسم المورد <span class="required-star">*</span></label>
                    <input type="text" id="supplierName" class="modal-input" placeholder="أدخل اسم المورد" required>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-phone"></i> رقم الهاتف <span class="required-star">*</span></label>
                    <input type="text" id="supplierPhone" class="modal-input" placeholder="01XXXXXXXXX" required>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-map-marker-alt"></i> العنوان</label>
                    <input type="text" id="supplierAddress" class="modal-input" placeholder="العنوان (اختياري)">
                </div>

                <div class="field-group">
                    <label><i class="fas fa-credit-card"></i> طريقة الدفع <span class="required-star">*</span></label>
                    <select id="paymentMethod" class="modal-input" required>
                        <option value="cash">كاش</option>
                        <option value="credit">آجل</option>
                        <option value="installment">تقسيط</option>
                    </select>
                </div>

                <div class="field-group">
                    <label><i class="fas fa-file-invoice-dollar"></i> المبلغ المستحق</label>
                    <input type="number" id="dueAmount" class="modal-input" value="0" readonly>
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> حفظ
                    </button>
                    <button type="button" class="btn-cancel" onclick="closeSupplierModal()">
                        <i class="fas fa-times"></i> إلغاء
                    </button>
                </div>
            </form>
            </div><!-- end modal-scroll-inner -->
        </div>
    </div>

    <div id="footer-container" class="z-10"></div>

    <script type="module" src="../js/calculator.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/suppliers.js"></script>

    <script>
        function openAddSupplierModal() {
            document.getElementById('formTitle').textContent = 'إضافة مورد جديد';
            document.getElementById('supplierForm').reset();
            document.getElementById('editingSupplierId').value = '';
            document.getElementById('dueAmount').value = '0';
            document.getElementById('supplierModal').classList.add('open');
            setTimeout(() => document.getElementById('supplierName').focus(), 200);
        }

        function closeSupplierModal() {
            document.getElementById('supplierModal').classList.remove('open');
            document.getElementById('supplierForm').reset();
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('supplierModal')) {
                closeSupplierModal();
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeSupplierModal();
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="suppliers">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الموردين</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/output.css">
    <link rel="stylesheet" href="../styles/home.css">
    <link rel="stylesheet" href="../styles/suppliers.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body data-page="suppliers">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <main class="main-content pt-10">
        <div class="p-6 max-w-7xl mx-auto">
            <!-- Page Header -->
            <div class="page-header">
                <div class="header-top">
                    <div class="page-title-group">
                        <div class="page-icon-badge">
                            <i class="fas fa-truck-moving"></i>
                        </div>
                        <div>
                            <h1>إدارة الموردين</h1>
                            <p>إدارة بيانات الموردين، حسابات المديونية، وسجل المعاملات</p>
                        </div>
                    </div>

                    <!-- Header Stats -->
                    <div class="header-stats">
                        <div class="stat-pill">
                            <i class="fas fa-truck"></i>
                            <div class="stat-info">
                                <span class="stat-label">إجمالي الموردين</span>
                                <span id="totalSuppliersCount" class="stat-value">0 مورد</span>
                            </div>
                        </div>
                        <div class="stat-pill">
                            <i class="fas fa-hand-holding-usd"></i>
                            <div class="stat-info">
                                <span class="stat-label">إجمالي المديونية</span>
                                <span id="totalDueSum" class="stat-value">0 ج.م</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Header Controls (Search + Action Buttons) -->
                <div class="header-controls">
                    <div class="search-box-wrap">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchSupplierInput" class="search-input"
                            placeholder="بحث باسم المورد، رقم الهاتف، أو العنوان..."
                            oninput="handleSupplierSearch(this.value)">
                    </div>

                    <div class="header-action-btns">
                        <button class="add-btn-header" onclick="openAddSupplierModal()">
                            <i class="fas fa-plus-circle"></i>
                            <span>إضافة مورد جديد</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Suppliers Cards Grid -->
            <div id="suppliersList"></div>

            <!-- Back to Home Link -->
            <div class="back-link-wrap">
                <a href="index.html" class="btn-back-home">
                    <i class="fas fa-arrow-right"></i>
                    <span>العودة للرئيسية</span>
                </a>
            </div>
        </div>
    </main>

    <!-- ===== Add / Edit Supplier Modal ===== -->
    <div id="supplierModal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="custom-modal-box supplier-modal-box">
            <div class="modal-scroll-inner">
                <div class="modal-header">
                    <div class="modal-title">
                        <div class="modal-title-icon" id="modalIcon">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <div>
                            <h3 id="formTitle">إضافة مورد جديد</h3>
                            <p id="formSubtitle" class="modal-subtitle">أدخل بيانات المورد وطريقة الدفع المعتمدة</p>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeSupplierModal()" title="إغلاق">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <form id="supplierForm" onsubmit="event.preventDefault(); saveSupplier();">
                    <input type="hidden" id="editingSupplierId">

                    <!-- Row 1: Name & Phone (2 columns) -->
                    <div class="form-grid-2">
                        <div class="field-group">
                            <label for="supplierName"><i class="fas fa-signature"></i> اسم المورد <span
                                    class="required-star">*</span></label>
                            <input type="text" id="supplierName" class="modal-input"
                                placeholder="أدخل اسم المورد أو الشركة" required>
                        </div>

                        <div class="field-group">
                            <label for="supplierPhone"><i class="fas fa-phone"></i> رقم الهاتف <span
                                    class="required-star">*</span></label>
                            <input type="text" id="supplierPhone" class="modal-input" placeholder="01XXXXXXXXX"
                                required>
                        </div>
                    </div>

                    <!-- Row 2: Address & Payment Method (2 columns) -->
                    <div class="form-grid-2">
                        <div class="field-group">
                            <label for="supplierAddress"><i class="fas fa-map-marker-alt"></i> العنوان</label>
                            <input type="text" id="supplierAddress" class="modal-input"
                                placeholder="العنوان أو الفرع (اختياري)">
                        </div>

                        <div class="field-group">
                            <label for="paymentMethod"><i class="fas fa-credit-card"></i> طريقة الدفع المعتمدة <span
                                    class="required-star">*</span></label>
                            <select id="paymentMethod" class="modal-select" required>
                                <option value="cash">كاش (نقدي)</option>
                                <option value="credit">آجل</option>
                                <option value="installment">تقسيط (دفعات)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 3: Due Amount -->
                    <div class="field-group">
                        <label for="dueAmount"><i class="fas fa-file-invoice-dollar"></i> المبلغ المستحق (ج.م)</label>
                        <input type="number" id="dueAmount" class="modal-input" value="0" readonly>
                    </div>

                    <div class="modal-footer">
                        <button type="submit" class="btn-save-modal">
                            <i class="fas fa-save"></i>
                            <span>حفظ بيانات المورد</span>
                        </button>
                        <button type="button" class="btn-cancel-modal" onclick="closeSupplierModal()">
                            <i class="fas fa-times"></i>
                            <span>إلغاء</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container" class="z-10"></div>

    <!-- Scripts -->
    <script type="module" src="../js/calculator.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/suppliers.js"></script>
</body>

</html>

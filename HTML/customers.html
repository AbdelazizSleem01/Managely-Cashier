<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link href="../styles/output.css" rel="stylesheet">
    <link href="../styles/home.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --accent-color: #10b981;
            --dark-color: #1e293b;
            --light-color: #f8fafc;
        }
        
        body {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            min-height: 100vh;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
   
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .card-header {
            background: white;
            color: #4d00c9;
            padding: 1.25rem 1.5rem;
            font-weight: 600;
            font-size: 1.25rem;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        
        .btn-outline.btn-primary {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }
        
        .btn-outline.btn-primary:hover {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-error {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }
        
        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .table th {
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1rem;
            font-weight: 600;
            text-align: right;
        }
        
        .table td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }
        
        .table tr:last-child td {
            border-bottom: none;
        }
        
        .table tr:hover td {
            background-color: #f8fafc;
        }
        
        .input {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        
        .input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        
        .btn-xs {
            padding: 0.35rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 6px;
        }
        
        .empty-state {
            padding: 2rem;
            text-align: center;
            color: #64748b;
        }
        
        .empty-state i {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
        
        @media (max-width: 768px) {
            .main-content {
                padding: 1rem;
            }
            
            .page-title {
                font-size: 2rem;
            }
            
            .grid-cols-2 {
                grid-template-columns: 1fr;
            }
            
            .table th, .table td {
                padding: 0.75rem;
            }
        }
    </style>
</head>

<body class="bg-gray-100" data-page="customers">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold mb-8 page-title text-center ">إدارة العملاء</h1>

            <!-- Add Customer Form -->
            <div class="card mb-8">
                <div class="card-header">إضافة عميل جديد</div>
                <div class="p-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">اسم العميل <span class="required-star">*</span></label>
                            <input id="newCustomerName" type="text" placeholder="أدخل اسم العميل"
                                class="input input-bordered bg-transparent input-primary w-full">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">رقم الهاتف <span class="required-star">*</span></label>
                            <input id="newCustomerPhone" type="text" placeholder="أدخل رقم الهاتف"
                                class="input input-bordered bg-transparent input-primary w-full">
                        </div>
                    </div>
                    <button onclick="addCustomer()" class="btn btn-primary w-full md:w-auto mt-2">
                        <i class="fas fa-plus-circle mr-2"></i> إضافة عميل
                    </button>
                </div>
            </div>

            <!-- Customers List -->
            <div class="card">
                <div class="card-header">قائمة العملاء</div>
                <div class="p-4">
                    <div id="customersTable" class="overflow-x-auto">
                        <!-- Customers will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- زر العودة للرئيسية -->
        <div class="mt-12 text-center">
            <a href="index.html" class="btn btn-outline btn-primary">
                العودة للرئيسية  <i class="fas fa-arrow-left ml-2"></i> 
            </a>
        </div>
        
    </div>
    
    <div id="footer-container" class="z-10"></div>
    <script type="module" src="../js/calculator.js"></script>

    <script type="module" src="../js/home.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCustomers();
        });
        window.addCustomer = addCustomer;
        window.editCustomer = editCustomer;
        window.deleteCustomer = deleteCustomer;
    </script>
</body>

</html>

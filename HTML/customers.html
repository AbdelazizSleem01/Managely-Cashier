<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link href="../styles/output.css" rel="stylesheet">
    <link href="../styles/home.css" rel="stylesheet">
    <link href="../styles/customers.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body data-page="customers">
    <!-- Sidebar Container -->
    <div id="sidebar-container"></div>

    <main class="main-content pt-10">
        <div class="p-6 max-w-7xl mx-auto">
            <!-- Page Header -->
            <div class="page-header">
                <div class="header-top">
                    <div class="page-title-group">
                        <div class="page-icon-badge">
                            <i class="fas fa-users"></i>
                        </div>
                        <div>
                            <h1>إدارة العملاء</h1>
                            <p>إدارة وتتبع بيانات العملاء وسجل المبيعات والمعاملات</p>
                        </div>
                    </div>

                    <!-- Header Stats -->
                    <div class="header-stats">
                        <div class="stat-pill">
                            <i class="fas fa-user-friends"></i>
                            <div class="stat-info">
                                <span class="stat-label">إجمالي العملاء</span>
                                <span id="totalCustomersCount" class="stat-value">0 عميل</span>
                            </div>
                        </div>
                        <div class="stat-pill">
                            <i class="fas fa-coins"></i>
                            <div class="stat-info">
                                <span class="stat-label">إجمالي المبيعات</span>
                                <span id="totalPurchasesSum" class="stat-value">0 ج.م</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Header Controls (Search + Action Buttons) -->
                <div class="header-controls">
                    <div class="search-box-wrap">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="searchCustomerInput" class="search-input"
                            placeholder="بحث بالاسم، رقم الهاتف، العنوان، أو الملاحظات..."
                            oninput="handleCustomerSearch(this.value)">
                    </div>

                    <div class="header-action-btns">
                        <button class="add-btn-header" onclick="openAddCustomerModal()">
                            <i class="fas fa-user-plus"></i>
                            <span>إضافة عميل جديد</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Customers Cards Grid -->
            <div id="customersList"></div>

            <!-- Back to Home Link -->
            <div class="back-link-wrap">
                <a href="index.html" class="btn-back-home">
                    <i class="fas fa-arrow-right"></i>
                    <span>العودة للرئيسية</span>
                </a>
            </div>
        </div>
    </main>

    <!-- ===== Add / Edit Customer Modal ===== -->
    <div id="customerModal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
        <div class="custom-modal-box customer-modal-box">
            <div class="modal-scroll-inner">
                <div class="modal-header">
                    <div class="modal-title">
                        <div class="modal-title-icon" id="modalIcon">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <div>
                            <h3 id="formTitle">إضافة عميل جديد</h3>
                            <p id="formSubtitle" class="modal-subtitle">أدخل بيانات العميل ومعلومات التواصل</p>
                        </div>
                    </div>
                    <button class="modal-close" onclick="closeCustomerModal()" title="إغلاق">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <form id="customerForm">
                    <input type="hidden" id="editingCustomerId">

                    <!-- Basic Info Fields -->
                    <div class="form-grid-2">
                        <div class="field-group">
                            <label for="customerName"><i class="fas fa-user"></i> اسم العميل <span
                                    class="required-star">*</span></label>
                            <input type="text" id="customerName" class="modal-input"
                                placeholder="أدخل اسم العميل بالكامل" required>
                        </div>

                        <div class="field-group">
                            <label for="customerPhone"><i class="fas fa-phone"></i> رقم الهاتف <span
                                    class="required-star">*</span></label>
                            <input type="text" id="customerPhone" class="modal-input" placeholder="01XXXXXXXXX"
                                required>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="customerAddress"><i class="fas fa-map-marker-alt"></i> العنوان</label>
                        <input type="text" id="customerAddress" class="modal-input"
                            placeholder="المدينة، المنطقة، الشارع (اختياري)">
                    </div>

                    <div class="field-group">
                        <label for="customerNotes"><i class="fas fa-sticky-note"></i> ملاحظات إضافية</label>
                        <textarea id="customerNotes" class="modal-textarea"
                            placeholder="أية ملاحظات حول العميل، التفضيلات، إلخ (اختياري)"></textarea>
                    </div>

                    <!-- Modal Actions -->
                    <div class="modal-footer">
                        <button type="submit" id="saveCustomerBtn" class="btn-save-modal">
                            <i class="fas fa-save"></i>
                            <span>حفظ البيانات</span>
                        </button>
                        <button type="button" class="btn-cancel-modal" onclick="closeCustomerModal()">
                            <i class="fas fa-times"></i>
                            <span>إلغاء</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== Customer Transactions / Sales History Modal ===== -->
    <div id="customerTransactionsModal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
        <div class="custom-modal-box" style="max-width: 720px;">
            <div class="modal-scroll-inner">
                <div class="modal-header">
                    <div class="modal-title">
                        <div class="modal-title-icon">
                            <i class="fas fa-history"></i>
                        </div>
                        <span id="transactionsModalTitle">سجل معاملات العميل</span>
                    </div>
                    <button class="modal-close" onclick="closeTransactionsModal()" title="إغلاق">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div id="transactionsContent">
                    <!-- Loaded dynamically in js/customers.js -->
                </div>

                <div class="modal-footer" style="justify-content: flex-end;">
                    <button type="button" class="btn-cancel-modal" onclick="closeTransactionsModal()">
                        <i class="fas fa-times"></i>
                        <span>إغلاق</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container" class="z-10"></div>

    <!-- Scripts -->
    <script type="module" src="../js/calculator.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/customers.js"></script>
</body>

</html>

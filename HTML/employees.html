<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الموظفين</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="../styles/output.css" rel="stylesheet">
    <link href="../styles/home.css" rel="stylesheet">
    <link href="../styles/employees.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
    <style>
         .hidden-content {
            display: none;
        }

        .loading-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f8fafc;
            font-size: 1.5rem;
            color: #64748b;
        }
    </style>
</head>

<body class="min-h-screen" data-page="employees">
    <div id="loadingScreen" class="loading-screen">
        <i class="fas fa-spinner fa-spin mr-2"></i> جاري التحميل...
    </div>

    <div id="pageContent" class="hidden-content">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="container mx-auto p-6">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 page-title">إدارة الموظفين</h1>
                </div>

                <div id="employeesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>

                <div class="form-section">
                    <h2>إضافة موظف جديد</h2>
                    <form id="employeeForm">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="form-input">
                                <label for="employeeName">اسم الموظف</label>
                                <input id="employeeName" class="input input-bordered w-full text-gray-800"
                                    placeholder="اسم الموظف" required>
                            </div>
                            <div class="form-input">
                                <label for="employeePhone">رقم الهاتف</label>
                                <input id="employeePhone" class="input input-bordered w-full text-gray-800"
                                    placeholder="رقم الهاتف" required>
                            </div>
                            <div class="form-input">
                                <label for="employeeAddress">العنوان</label>
                                <input id="employeeAddress" class="input input-bordered w-full text-gray-800"
                                    placeholder="العنوان" required>
                            </div>
                            <div class="form-input">
                                <label for="employeeSalary">الراتب (جنيه)</label>
                                <input id="employeeSalary" type="number" min="0" step="0.01"
                                    class="input input-bordered w-full text-gray-800" placeholder="الراتب" required>
                            </div>
                            <div class="form-input">
                                <label for="employeeEducation">المؤهل الدراسي</label>
                                <input id="employeeEducation" class="input input-bordered w-full text-gray-800"
                                    placeholder="المؤهل الدراسي" required>
                            </div>
                            <div class="form-input">
                                <label for="employeeJobTitle">الوظيفة</label>
                                <input id="employeeJobTitle" class="input input-bordered w-full text-gray-800"
                                    placeholder="الوظيفة" required>
                            </div>
                            <div class="form-input">
                                <label for="employeeHireDate">تاريخ التعيين</label>
                                <input id="employeeHireDate" type="date"
                                    class="input input-bordered w-full text-gray-800 datepicker-dark" required>
                            </div>
                        </div>
                        <div class="file-input-container block">
                            <label for="employeePhoto" class="file-input-label">صورة الموظف:</label>
                            <div class="custom-file-input">
                                <input id="employeePhoto" type="file" accept="image/*" class="hidden-file-input">
                                <label for="employeePhoto" class="file-input-box">
                                    <div class="file-input-icon">
                                        <i class="fas fa-camera text-2xl"></i>
                                    </div>
                                    <div class="file-input-text">
                                        <span class="file-input-title">اختر صورة الموظف</span>
                                        <span class="file-input-hint">JPEG, PNG (الحجم الأقصى 5MB)</span>
                                    </div>
                                </label>
                            </div>
                            <div id="photoPreview" class="mt-2 hidden">
                                <img id="photoPreviewImg" class="employee-photo" src="" alt="معاينة الصورة">
                            </div>
                        </div>

                        <div class="file-input-container">
                            <label for="employeeIdPhoto" class="file-input-label">صورة البطاقة:</label>
                            <div class="custom-file-input">
                                <input id="employeeIdPhoto" type="file" accept="image/*" class="hidden-file-input">
                                <label for="employeeIdPhoto" class="file-input-box">
                                    <div class="file-input-icon">
                                        <i class="fas fa-id-card text-2xl"></i>
                                    </div>
                                    <div class="file-input-text">
                                        <span class="file-input-title">اختر صورة البطاقة</span>
                                        <span class="file-input-hint">JPEG, PNG (الحجم الأقصى 5MB)</span>
                                    </div>
                                </label>
                            </div>
                            <div id="idPhotoPreview" class="mt-2 hidden">
                                <img id="idPhotoPreviewImg" class="employee-id-photo " src="" alt="معاينة صورة البطاقة">
                            </div>
                        </div>

                        <div class="file-input-container">
                            <label for="employeeCV" class="file-input-label">ملف السيرة الذاتية (اختياري):</label>
                            <div class="custom-file-input">
                                <input id="employeeCV" type="file" accept=".pdf" class="hidden-file-input">
                                <label for="employeeCV" class="file-input-box">
                                    <div class="file-input-icon">
                                        <i class="fas fa-file-pdf text-2xl"></i>
                                    </div>
                                    <div class="file-input-text">
                                        <span class="file-input-title">اختر ملف السيرة الذاتية</span>
                                        <span class="file-input-hint">PDF فقط (الحجم الأقصى 10MB)</span>
                                    </div>
                                </label>
                            </div>
                            <div id="cvPreview" class="mt-2 hidden">
                                <div class="pdf-preview">
                                    <i class="fas fa-file-pdf text-4xl text-red-500"></i>
                                    <span id="cvFileName" class="text-sm font-medium text-gray-700 mt-2"></span>
                                    <button id="viewPdfBtn" class="text-blue-500 hover:underline text-sm mt-1">
                                        <i class="fas fa-eye mr-1"></i> عرض الملف
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="form-footer flex mt-4">
                            <button type="submit" id="saveEmployeeBtn" class="btn btn-primary py-2 px-4 rounded">
                                <i class="fas fa-save"></i> حفظ
                            </button>
                            <button type="button" onclick="resetForm()"
                                class="btn bg-gray-600 hover:bg-gray-900 text-white py-2 px-4 rounded">
                                <i class="fas fa-times"></i> إلغاء
                            </button>
                        </div>
                    </form>
                </div>
                <div class="flex items-center justify-center mt-6 gap-4">

                    <button id="changePasswordBtn" class="btn btn-primary ">
                        تغيير كلمة المرور
                        <i class="fas fa-pen-to-square"></i>

                    </button>
                    <a href="index.html"
                        class="btn  btn-primary px-8 hover:bg-primary hover:text-white transition duration-300">
                        العودة للرئيسية
                        <i class="fas fa-home "></i>
                    </a>
                </div>
            </div>
        </main>
        
    </div>
    <div id="footer-container" class="z-10"></div>
    <script type="module" src="../js/calculator.js"></script>
    <script type="module" src="../js/shared.js"></script>
    <script type="module" src="../js/employees.js"></script>
</body>

</html>
